<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gastos</title>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#111111" />
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;margin:0;background:#0b0b0b;color:#f2f2f2}
    header{padding:16px;background:#111;position:sticky;top:0;border-bottom:1px solid #222;z-index:5}
    h1{margin:0;font-size:18px}
    .wrap{max-width:860px;margin:0 auto;padding:16px}
    .card{background:#121212;border:1px solid #242424;border-radius:14px;padding:14px;margin-bottom:14px}
    label{display:block;font-size:12px;opacity:.85;margin:10px 0 6px}
    input,select,textarea{width:100%;padding:12px;border-radius:12px;border:1px solid #2a2a2a;background:#0e0e0e;color:#f2f2f2}
    textarea{min-height:70px;resize:vertical}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    button{width:100%;padding:12px;border-radius:12px;border:0;background:#2d6cdf;color:#fff;font-weight:700;margin-top:12px}
    button.secondary{background:#333}
    .kpis{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
    .kpi{padding:12px;border-radius:12px;background:#0e0e0e;border:1px solid #2a2a2a}
    .kpi .t{font-size:12px;opacity:.8}
    .kpi .v{font-size:18px;font-weight:800;margin-top:6px}
    table{width:100%;border-collapse:collapse;font-size:13px}
    th,td{padding:10px;border-bottom:1px solid #222;text-align:left;vertical-align:top}
    .pill{display:inline-block;padding:4px 8px;border:1px solid #2a2a2a;border-radius:999px;font-size:12px;opacity:.9}
    .muted{opacity:.75;font-size:12px}
    .right{text-align:right}
    .smallbtn{padding:6px 10px;border-radius:10px;border:1px solid #2a2a2a;background:#161616;color:#fff}
    .linkbtn{display:inline-block;padding:6px 10px;border-radius:10px;border:1px solid #2a2a2a;background:#0e0e0e;color:#fff;text-decoration:none}
    .stack{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
  </style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>📱 Gastos Mensais (com anexos PDF/Imagem)</h1>
    <div class="muted">Tudo fica salvo no seu iPhone (sem pagar servidor).</div>
  </div>
</header>

<div class="wrap">

  <div class="card">
    <div class="row">
      <div>
        <label>Mês</label>
        <input id="mes" type="month">
      </div>
      <div>
        <label>Categoria</label>
        <select id="categoria">
          <option>Alimentação</option>
          <option>Transporte</option>
          <option>Casa</option>
          <option>Saúde</option>
          <option>Lazer</option>
          <option>Educação</option>
          <option>Contas</option>
          <option>Outros</option>
        </select>
      </div>
    </div>

    <label>Descrição</label>
    <input id="descricao" placeholder="Ex: mercado, gasolina, farmácia...">

    <div class="row">
      <div>
        <label>Data</label>
        <input id="data" type="date">
      </div>
      <div>
        <label>Valor (R$)</label>
        <input id="valor" type="number" step="0.01" placeholder="0,00">
      </div>
    </div>

    <label>Forma de pagamento</label>
    <select id="pagamento">
      <option>Pix</option>
      <option>Cartão Crédito</option>
      <option>Cartão Débito</option>
      <option>Dinheiro</option>
      <option>Boleto</option>
    </select>

    <label>Anexo (PDF ou imagem)</label>
    <input id="anexo" type="file" accept="application/pdf,image/*" />

    <button id="btnAdd">Adicionar gasto</button>

    <div class="row">
      <button class="secondary" id="btnExportCSV">Exportar CSV (sem anexos)</button>
      <button class="secondary" id="btnBackup">Backup JSON (com anexos)</button>
    </div>

    <div class="muted" style="margin-top:10px">
      Dica: prefira anexos menores (ex.: 1–5MB). PDFs muito grandes podem falhar no iPhone.
    </div>
  </div>

  <div class="card">
    <div class="kpis">
      <div class="kpi"><div class="t">Total do mês</div><div class="v" id="kpiTotal">R$ 0,00</div></div>
      <div class="kpi"><div class="t">Qtd. lançamentos</div><div class="v" id="kpiQtd">0</div></div>
      <div class="kpi"><div class="t">Maior categoria</div><div class="v" id="kpiTop">—</div></div>
    </div>
  </div>

  <div class="card">
    <div style="display:flex; justify-content:space-between; align-items:center; gap:10px">
      <div><strong>Lista</strong> <span class="pill" id="pillMes"></span></div>
      <button class="secondary" id="btnClear" style="max-width:200px">Limpar mês</button>
    </div>

    <div style="overflow:auto; margin-top:10px">
      <table>
        <thead>
          <tr>
            <th>Data</th>
            <th>Categoria</th>
            <th>Descrição</th>
            <th>Pag.</th>
            <th class="right">Valor</th>
            <th class="right">Ações</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>

</div>

<script>
/** ===== IndexedDB (simples) ===== */
const DB_NAME = "gastos_db_v1";
const DB_VER  = 1;
const STORE   = "itens";

function openDB(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = () => {
      const db = req.result;
      if(!db.objectStoreNames.contains(STORE)){
        db.createObjectStore(STORE, { keyPath: "id" });
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function dbPut(item){
  const db = await openDB();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(STORE, "readwrite");
    tx.objectStore(STORE).put(item);
    tx.oncomplete = () => resolve(true);
    tx.onerror = () => reject(tx.error);
  });
}

async function dbGetAll(){
  const db = await openDB();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(STORE, "readonly");
    const req = tx.objectStore(STORE).getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => reject(req.error);
  });
}

async function dbDelete(id){
  const db = await openDB();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(STORE, "readwrite");
    tx.objectStore(STORE).delete(id);
    tx.oncomplete = () => resolve(true);
    tx.onerror = () => reject(tx.error);
  });
}

async function dbClearMonth(mes){
  const all = await dbGetAll();
  const toKeep = all.filter(x => x.mes !== mes);
  const db = await openDB();
  await new Promise((resolve, reject)=>{
    const tx = db.transaction(STORE, "readwrite");
    const store = tx.objectStore(STORE);
    store.clear();
    tx.oncomplete = resolve;
    tx.onerror = () => reject(tx.error);
  });
  for (const it of toKeep) await dbPut(it);
}

/** ===== App ===== */
const $ = (id)=>document.getElementById(id);

function brl(n){
  return (n||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
}
function currentMonth(){
  const now = new Date();
  const y = now.getFullYear();
  const m = String(now.getMonth()+1).padStart(2,"0");
  return `${y}-${m}`;
}
function todayISO(){
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,"0");
  const dd = String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${dd}`;
}

function uid(){
  return (crypto.randomUUID ? crypto.randomUUID() : (Date.now() + "_" + Math.random()).replace(".",""));
}

async function fileToDataURL(file){
  // data:...;base64,...
  return new Promise((resolve, reject)=>{
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = () => reject(r.error);
    r.readAsDataURL(file);
  });
}

function downloadText(filename, text, mime="application/json"){
  const blob = new Blob([text], {type:mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  a.click();
  setTimeout(()=>URL.revokeObjectURL(url), 800);
}

function makePreviewLink(att){
  // att = {name,type,dataUrl}
  // Para PDF/Imagem, abrir em nova aba a partir do dataUrl
  const a = document.createElement("a");
  a.className = "linkbtn";
  a.href = att.dataUrl;
  a.target = "_blank";
  a.rel = "noopener";
  a.textContent = att.type.startsWith("image/") ? "Ver imagem" : "Abrir PDF";
  return a;
}

async function render(){
  const mes = $("mes").value || currentMonth();
  $("pillMes").textContent = mes;

  const all = await dbGetAll();
  const itensMes = all
    .filter(x => x.mes === mes)
    .sort((a,b)=> (a.data||"").localeCompare(b.data||""));

  // KPIs
  let total = 0;
  const sumCat = {};
  for(const x of itensMes){
    total += x.valor;
    sumCat[x.categoria] = (sumCat[x.categoria]||0) + x.valor;
  }
  const top = Object.entries(sumCat).sort((a,b)=>b[1]-a[1])[0];

  $("kpiTotal").textContent = brl(total);
  $("kpiQtd").textContent = String(itensMes.length);
  $("kpiTop").textContent = top ? `${top[0]} (${brl(top[1])})` : "—";

  // Tabela
  const tbody = $("tbody");
  tbody.innerHTML = "";

  for(const x of itensMes){
    const tr = document.createElement("tr");

    const tdData = document.createElement("td");
    tdData.textContent = x.data;

    const tdCat = document.createElement("td");
    tdCat.textContent = x.categoria;

    const tdDesc = document.createElement("td");
    tdDesc.textContent = x.descricao;

    const tdPag = document.createElement("td");
    tdPag.textContent = x.pagamento;

    const tdVal = document.createElement("td");
    tdVal.className = "right";
    tdVal.textContent = brl(x.valor);

    const tdAcoes = document.createElement("td");
    tdAcoes.className = "right";

    const stack = document.createElement("div");
    stack.className = "stack";

    if (x.anexo){
      // Mostrar botão para abrir anexo
      stack.appendChild(makePreviewLink(x.anexo));
    }

    const btnDel = document.createElement("button");
    btnDel.className = "smallbtn";
    btnDel.textContent = "Excluir";
    btnDel.onclick = async ()=>{
      await dbDelete(x.id);
      await render();
    };

    stack.appendChild(btnDel);
    tdAcoes.appendChild(stack);

    tr.appendChild(tdData);
    tr.appendChild(tdCat);
    tr.appendChild(tdDesc);
    tr.appendChild(tdPag);
    tr.appendChild(tdVal);
    tr.appendChild(tdAcoes);

    tbody.appendChild(tr);
  }
}

async function addItem(){
  const mes = $("mes").value || currentMonth();
  const data = $("data").value || (mes + "-01");
  const categoria = $("categoria").value;
  const descricao = $("descricao").value.trim();
  const pagamento = $("pagamento").value;
  const valor = Number($("valor").value);
  const file = $("anexo").files && $("anexo").files[0] ? $("anexo").files[0] : null;

  if(!descricao) return alert("Preencha a descrição.");
  if(!valor || valor<=0) return alert("Informe um valor > 0.");

  let anexo = null;
  if(file){
    // Aviso simples de tamanho
    const sizeMB = file.size / (1024*1024);
    if(sizeMB > 12){
      const ok = confirm(`Esse anexo tem ~${sizeMB.toFixed(1)}MB. No iPhone pode falhar/ocupar muito espaço. Quer continuar?`);
      if(!ok) return;
    }
    const dataUrl = await fileToDataURL(file);
    anexo = { name: file.name, type: file.type || "application/octet-stream", dataUrl };
  }

  const item = {
    id: uid(),
    mes,
    data,
    categoria,
    descricao,
    pagamento,
    valor,
    anexo,         // null ou {name,type,dataUrl}
    createdAt: Date.now()
  };

  await dbPut(item);

  $("descricao").value = "";
  $("valor").value = "";
  $("anexo").value = "";
  await render();
}

async function exportCSV(){
  const mes = $("mes").value || currentMonth();
  const all = await dbGetAll();
  const itensMes = all.filter(x => x.mes === mes);

  const header = ["mes","data","categoria","descricao","pagamento","valor","tem_anexo","anexo_nome","anexo_tipo"];
  const rows = itensMes.map(x => ([
    x.mes, x.data, x.categoria, x.descricao, x.pagamento,
    String(x.valor),
    x.anexo ? "SIM" : "NAO",
    x.anexo ? x.anexo.name : "",
    x.anexo ? x.anexo.type : ""
  ]));

  const esc = (v)=> `"${String(v).replaceAll('"','""')}"`;
  const csv = [header.join(","), ...rows.map(r => r.map(esc).join(","))].join("\n");
  downloadText(`gastos_${mes}.csv`, csv, "text/csv;charset=utf-8");
}

async function backupJSON(){
  const all = await dbGetAll();
  // backup completo (inclui anexos em base64 -> pode ficar grande)
  downloadText(`backup_gastos_${Date.now()}.json`, JSON.stringify(all), "application/json");
}

async function clearMonth(){
  const mes = $("mes").value || currentMonth();
  if(!confirm(`Remover todos os lançamentos de ${mes}?`)) return;
  await dbClearMonth(mes);
  await render();
}

// init
(async ()=>{
  $("mes").value = currentMonth();
  $("data").value = todayISO();

  $("btnAdd").onclick = ()=>addItem().catch(err=>{
    console.error(err);
    alert("Falha ao salvar. Talvez o anexo seja grande demais.");
  });

  $("btnExportCSV").onclick = ()=>exportCSV().catch(console.error);
  $("btnBackup").onclick = ()=>backupJSON().catch(console.error);
  $("btnClear").onclick = ()=>clearMonth().catch(console.error);
  $("mes").onchange = ()=>render().catch(console.error);

  // PWA
  if ("serviceWorker" in navigator) {
    try { await navigator.serviceWorker.register("./sw.js"); } catch(e){}
  }

  await render();
})();
</script>
</body>
</html>
